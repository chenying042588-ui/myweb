<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片展示牆</title>
    <!-- 引入外部 CSS 檔 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>歡迎來到我的圖片展示區</h1>
        <p>將滑鼠移到圖片上可觀看動畫效果，點擊圖片可跳轉至目標網站。</p>

        <!-- 5 張圖片展示牆 -->
        <div class="gallery">

            <!-- 卡片 1 -->
            <a href="https://www.google.com" target="_blank" class="card">
                <div class="img-container">
                    <img src="https://picsum.photos/400/300?random=1" alt="作品 1">
                </div>
                <div class="card-title">前往 Google</div>
            </a>

            <!-- 卡片 2 -->
            <a href="https://www.youtube.com" target="_blank" class="card">
                <div class="img-container">
                    <img src="https://picsum.photos/400/300?random=2" alt="作品 2">
                </div>
                <div class="card-title">前往 YouTube</div>
            </a>

            <!-- 卡片 3 -->
            <a href="https://www.nuu.edu.tw" target="_blank" class="card">
                <div class="img-container">
                    <img src="https://picsum.photos/400/300?random=3" alt="作品 3">
                </div>
                <div class="card-title">國立聯合大學</div>
            </a>

            <!-- 卡片 4 -->
            <a href="https://github.com" target="_blank" class="card">
                <div class="img-container">
                    <img src="https://picsum.photos/400/300?random=4" alt="作品 4">
                </div>
                <div class="card-title">前往 GitHub</div>
            </a>

            <!-- 卡片 5 -->
            <a href="https://wikipedia.org" target="_blank" class="card">
                <div class="img-container">
                    <img src="https://picsum.photos/400/300?random=5" alt="作品 5">
                </div>
                <div class="card-title">前往 維基百科</div>
            </a>

        </div>

        <a href="https://www.nuu.edu.tw/" target="_blank" class="btn">關於我</a>
    </div>

</body>
</html>
